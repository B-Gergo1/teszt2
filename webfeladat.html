<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Szerverfeladat 2026</title>
    <style>
        body {
            background-color: darkgreen;
            color: white;
            text-align: center;
        }
        /* A gomb egyedi formázása */
        .pdf-gomb {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: transparent;
            color: white;
            text-block: none;
            border: 2px solid white;
            border-radius: 5px;
            text-decoration: none; /* Aláhúzás eltávolítása */
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        /* Efekt, ha ráviszed az egeret */
        .pdf-gomb:hover {
            background-color: white;
            color: darkgreen;
        }
    </style>
</head>
<body>
    <h1>Balogh Gergő</h1>
    
    <!-- Cseréld ki a "dokumentum.pdf" részt a saját PDF fájlod elérésére -->
    <a href="Dok1.pdf" target="_blank" class="pdf-gomb">PDF megnyitása</a>
</body>
</html>
